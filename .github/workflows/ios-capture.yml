name: Capture iOS App Store 1.2.2 screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build the real standalone Release app
        working-directory: apps/mobile
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          python3 - "$scheme" <<'PY'
          import plistlib,sys
          from pathlib import Path
          path=Path('ios')/sys.argv[1]/(sys.argv[1]+'.entitlements')
          p=plistlib.loads(path.read_bytes())
          p['application-identifier']='com.imrtech.inout'
          p['keychain-access-groups']=['com.imrtech.inout']
          path.write_bytes(plistlib.dumps(p))
          PY
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= > ../../artifacts-ios-build.log 2>&1 || { tail -100 ../../artifacts-ios-build.log; exit 1; }
          app=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          mkdir -p ../../artifacts/simulator
          ditto -c -k --keepParent "$app" ../../artifacts/simulator/inout-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-ios-simulator-1.2.2
          path: artifacts/simulator/inout-simulator.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-ios-build-log
          path: artifacts-ios-build.log
  capture:
    needs: build
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [en, es]
    env:
      CAPTURE_LANGUAGE: ${{ matrix.language }}
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: app-store-ios-simulator-1.2.2
          path: artifacts/simulator
      - name: Capture authentic localized screens
        run: bash scripts/app-store-ios-capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-ios-${{ matrix.language }}
          path: artifacts/app-store/ios/
          if-no-files-found: error
