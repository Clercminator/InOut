name: Capture iPhone store screens
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Native verification run containing the iOS simulator app
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: inout-ios-simulator
          run-id: ${{ inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/simulator
      - name: Install Maestro CLI
        run: |
          curl -fL https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          cli=$(find "$RUNNER_TEMP/maestro" -type f -path '*/bin/maestro' -print -quit)
          chmod +x "$cli"
          echo "MAESTRO_BIN=$cli" >> "$GITHUB_ENV"
      - name: Exercise the slice on iPhone
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,group in sorted(devices.items(),reverse=True) for d in group if "iPhone" in d["name"] and "Pro Max" in d["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          unzip -q artifacts/simulator/inout-simulator.zip -d artifacts/simulator/app
          app=$(find artifacts/simulator/app -maxdepth 1 -name '*.app' -print -quit)
          xcrun simctl install "$device" "$app"
          mkdir -p artifacts/ios-capture
          for attempt in 1 2; do
            output="$PWD/artifacts/ios-capture/attempt-$attempt"
            mkdir -p "$output"
            if "$MAESTRO_BIN" --device "$device" test -e SCREENSHOT_DIR="$output" --test-output-dir "$output/debug" --debug-output "$output/debug" --format junit --output "$output/results.xml" .maestro/ios-store.yaml; then
              test "$(find "$output" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')" = "6"
              echo "PASS on attempt $attempt" > artifacts/ios-capture/result.txt
              exit 0
            fi
            xcrun simctl io "$device" screenshot "$output/failure.png" || true
            xcrun simctl spawn "$device" log show --last 3m --style compact > "$output/simulator.log" 2>&1 || true
            # Retry only a failed XCTest transport, never an app assertion.
            if [ "$attempt" = 2 ] || ! grep -q 'DeviceUnreachableException' "$output/results.xml"; then
              exit 1
            fi
            xcrun simctl shutdown "$device"
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device" -b
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-runtime-evidence
          path: artifacts/ios-capture/
