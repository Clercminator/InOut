name: Native mobile verification
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx expo-doctor
        working-directory: apps/mobile
      - run: npx expo export --platform all --output-dir ../../artifacts/mobile-export
        working-directory: apps/mobile
  android-preview:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      # Expo's generated development key signs this internal preview, not a store release.
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: inout-android-preview
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python scripts/android-smoke.py apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-evidence
          path: artifacts/android-smoke/

  ios-simulator:
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Build standalone iOS simulator app
        working-directory: apps/mobile
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO > ../../artifacts-ios-build.log 2>&1 || { tail -120 ../../artifacts-ios-build.log; exit 1; }
      - name: Launch on iPhone simulator
        working-directory: apps/mobile
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=$(find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.imrtech.inout
          sleep 15
          mkdir -p ../../artifacts/ios-smoke
          xcrun simctl io "$device" screenshot ../../artifacts/ios-smoke/launch.png
          ditto -c -k --keepParent "$app" ../../artifacts/ios-smoke/inout-simulator.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inout-ios-simulator
          path: artifacts/ios-smoke/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: artifacts-ios-build.log
