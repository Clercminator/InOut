name: Release candidate visual QA
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Native verification run containing the release artifacts
        required: true
        type: string
  push:
    paths: ['.github/workflows/rc-visual.yml', '.maestro/rc-visual.yaml', 'scripts/rc-*-visual.sh']
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [typical, small-large-text]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: inout-android-preview
          run-id: ${{ inputs.build_run || '37577178870' }}
          github-token: ${{ github.token }}
          path: artifacts/app
      - name: Install Maestro
        run: |
          curl -fL https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.10.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          cli=$(find "$RUNNER_TEMP/maestro" -type f -path '*/bin/maestro' -print -quit)
          chmod +x "$cli"
          echo "MAESTRO_BIN=$cli" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          VIEWPORT: ${{ matrix.viewport }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/rc-android-visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-android-${{ matrix.viewport }}
          path: artifacts/rc-visual
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [modern, compact]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: inout-ios-simulator
          run-id: ${{ inputs.build_run || '37577178870' }}
          github-token: ${{ github.token }}
          path: artifacts/app
      - name: Capture native screens
        env:
          VIEWPORT: ${{ matrix.viewport }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: bash scripts/rc-ios-visual.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-ios-${{ matrix.viewport }}
          path: artifacts/rc-visual
