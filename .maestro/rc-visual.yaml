appId: com.imrtech.inout
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Quickstep isn't responding"
    commands:
      - tapOn: "Close app"
- scrollUntilVisible:
    element: { text: "Start breathing" }
    direction: DOWN
- takeScreenshot: 01-welcome
- scrollUntilVisible:
    element: { text: "Personalize InOut" }
    direction: DOWN
- tapOn: "Personalize InOut"
- scrollUntilVisible:
    element: { text: "Reduce stress & anxiety" }
    direction: UP
- tapOn: "Reduce stress & anxiety"
- takeScreenshot: 02-goals
- scrollUntilVisible:
    element: { text: "Continue" }
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "Comfort comes first."
- swipe:
    direction: LEFT
- assertVisible: "Comfort comes first."
- tapOn: "I understand"
- assertVisible: "A rhythm you can follow."
- takeScreenshot: onboarding-demo
- tapOn: "Start breathing"
- tapOn: "Close subscription offer"
- assertVisible: 'How tense are you right now\?'
- openLink: "inout://"
- tapOn: { text: "Open", optional: true }
- takeScreenshot: 06-home
- swipe:
    start: "30%,20%"
    end: "85%,20%"
- assertVisible: "Your practice, taking shape."
- swipe:
    start: "30%,20%"
    end: "85%,20%"
- assertVisible: "Your practice, taking shape."
- tapOn: "Back to Home"
- swipe:
    start: "85%,20%"
    end: "25%,20%"
- assertVisible: "Test yourself. Build a habit. Take it into your day."
- swipe:
    start: "25%,20%"
    end: "85%,20%"
- assertVisible: "Explore protocols"
- tapOn: "Explore protocols"
- takeScreenshot: 07-library
- tapOn: "Go back"
- tapOn: "Results"
- takeScreenshot: 08-progress-empty
- scrollUntilVisible:
    element: { text: "Calendar" }
    direction: DOWN
- tapOn: "Calendar"
- takeScreenshot: 09-calendar-empty
- tapOn: "Badges"
- takeScreenshot: 10-badges-locked
- openLink: "inout://add-session"
- tapOn: { text: "Open", optional: true }
- takeScreenshot: 11-manual-entry
- scrollUntilVisible:
    element: { text: "Save session" }
    direction: DOWN
- tapOn: "Save session"
- assertVisible: "Session saved"
- takeScreenshot: 12-achievement-earned
- openLink: "inout://milestone?badge=sessions-1"
- tapOn: { text: "Open", optional: true }
- takeScreenshot: 13-story-card
- tapOn: "Square.*"
- takeScreenshot: 14-square-card
- scrollUntilVisible:
    element: { text: "Share achievement" }
    direction: DOWN
- tapOn: "Share achievement"
- takeScreenshot: 15-native-share
- launchApp:
    stopApp: true
- tapOn: "My practice profile"
- takeScreenshot: 16-profile
- scrollUntilVisible:
    element: { text: "Edit profile" }
    direction: DOWN
- tapOn: "Edit profile"
- tapOn: "Display name"
- inputText: "Alex"
- takeScreenshot: 17-profile-keyboard
- hideKeyboard
- scrollUntilVisible:
    element: { text: "Save profile" }
    direction: DOWN
- tapOn: "Save profile"
- openLink: "inout://pre?id=physiological-sigh"
- tapOn: { text: "Open", optional: true }
- scrollUntilVisible:
    element: { text: "Skip rating & continue" }
    direction: DOWN
- tapOn: "Skip rating & continue"
- scrollUntilVisible:
    element: { text: "Start practice" }
    direction: DOWN
- tapOn: "Start practice"
- takeScreenshot: 18-session
- tapOn: "Pause"
- takeScreenshot: 19-paused
- tapOn: "Resume"
- extendedWaitUntil:
    visible: 'How tense are you now\?'
    timeout: 80000
- takeScreenshot: 20-post
- scrollUntilVisible:
    element: { text: "Skip & save session" }
    direction: DOWN
- tapOn: "Skip & save session"
- takeScreenshot: 21-result
- launchApp:
    stopApp: true
- tapOn: "My practice profile"
- scrollUntilVisible:
    element: { text: "Settings" }
    direction: DOWN
- tapOn: "Settings"
- takeScreenshot: 22-settings
- openLink: "inout://challenge?id=sleep-reset"
- tapOn: { text: "Open", optional: true }
- takeScreenshot: 23-challenge-detail
- openLink: "inout://custom-pattern"
- tapOn: { text: "Open", optional: true }
- takeScreenshot: 24-create-rhythm
- openLink: "inout://settings"
- tapOn: { text: "Open", optional: true }
- tapOn: "Appearance & language"
- scrollUntilVisible:
    element: { text: "Preview Pulse Default" }
    direction: DOWN
- takeScreenshot: 25-theme-gallery
- tapOn: "Preview Pulse Default"
- takeScreenshot: 26-theme-preview
- tapOn: "Close preview"
- openLink: "inout://pre?id=box"
- tapOn: { text: "Open", optional: true }
- scrollUntilVisible:
    element: { text: "Skip rating & continue" }
    direction: DOWN
- tapOn: "Skip rating & continue"
- scrollUntilVisible:
    element: { text: "I have read the precautions and I am in a safe place" }
    direction: DOWN
- tapOn: "I have read the precautions and I am in a safe place"
- tapOn: "Start practice"
- takeScreenshot: 27-box-active
- tapOn: "Pause"
- takeScreenshot: 28-box-paused
- tapOn: "Resume"
- tapOn: "End session"
- takeScreenshot: 29-end-confirmation
- tapOn: { id: "confirm-end-session" }
- scrollUntilVisible:
    element: { text: "Skip & save session" }
    direction: DOWN
- tapOn: "Skip & save session"
- openLink: "inout://pre?id=coherent"
- tapOn: { text: "Open", optional: true }
- scrollUntilVisible:
    element: { text: "Skip rating & continue" }
    direction: DOWN
- tapOn: "Skip rating & continue"
- scrollUntilVisible:
    element: { text: "Start practice" }
    direction: DOWN
- tapOn: "Start practice"
- takeScreenshot: 30-pulse-active
- tapOn: "Pause"
- takeScreenshot: 31-pulse-paused
- tapOn: "End session"
- tapOn: { id: "confirm-end-session" }
- scrollUntilVisible:
    element: { text: "Skip & save session" }
    direction: DOWN
- tapOn: "Skip & save session"
