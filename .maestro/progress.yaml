appId: com.imrtech.inout
---
- launchApp:
    clearState: true
- tapOn: "Personalize InOut"
- tapOn: "Reduce stress & anxiety"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "Comfort comes first."
- swipe:
    direction: LEFT
- assertVisible: "Comfort comes first."
- tapOn: "I understand"
- assertVisible: "A rhythm you can follow."
- takeScreenshot: onboarding-demo
- tapOn: "Start breathing"
- tapOn: "Close subscription offer"
- assertVisible: 'How are you feeling right now\?'
- tapOn: "Go back"
- tapOn: ".*Results"
- assertVisible: "DAY STREAK"
- takeScreenshot: progress-overview
- scrollUntilVisible:
    element:
      text: "Add session"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn:
    text: "Add session"
    retryTapIfNoChange: true
- assertVisible: "Log your breathing practice."
- scrollUntilVisible:
    element:
      text: "Choose date"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "Choose date"
- takeScreenshot: native-date-picker
- tapOn: "Cancel picker"
- tapOn: "Choose time"
- takeScreenshot: native-time-picker
- tapOn: "Done"
- scrollUntilVisible:
    element:
      text: "Save session"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "Save session"
- assertVisible: "Session saved"
- takeScreenshot: manual-saved
- tapOn: "View progress"
- scrollUntilVisible:
    element:
      text: "See all stats"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "See all stats"
- assertVisible: "MY STATS"
- tapOn: "Weeks"
- takeScreenshot: stats-weekly
- scrollUntilVisible:
    element:
      text: "Previous period"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn:
    text: "Previous period"
    index: 0
- takeScreenshot: chart-selected-period
- tapOn: "Go back"
- scrollUntilVisible:
    element:
      text: "View session history"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "View session history"
- assertVisible: "Manual breathing"
- takeScreenshot: manual-history

- openLink:
    link: "inout://pre?id=box"
- extendedWaitUntil:
    visible: "Open|Skip rating & continue"
    timeout: 20000
- tapOn:
    text: "Open"
    optional: true
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: "Skip rating & continue"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn:
    text: "Skip rating & continue"
    waitToSettleTimeoutMs: 100
- assertVisible: "Breathe comfortably."
- tapOn: "I have read the precautions and I am in a safe place"
- tapOn: "Start practice"
- extendedWaitUntil:
    visible: "Next: Exhale.*"
    timeout: 25000
- takeScreenshot: breathing-hold-after-inhale
- extendedWaitUntil:
    visible: "Next: Inhale.*"
    timeout: 25000
- takeScreenshot: breathing-hold-after-exhale
- tapOn: "Pause"
- assertVisible: "Paused.*"
- takeScreenshot: breathing-paused
- tapOn: "Resume"
- extendedWaitUntil:
    visible: 'How are you feeling right now\?'
    timeout: 240000
- takeScreenshot: breathing-completed
