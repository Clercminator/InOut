appId: com.imrtech.inout
---
- launchApp:
    clearState: true
- tapOn: "Personalize InOut"
- tapOn: "Reduce stress & anxiety"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn: "Continue"
- tapOn: "Let's get started"
- scrollUntilVisible:
    element:
      text: "I understand"
    direction: DOWN
- tapOn: "I understand"
- tapOn: "Close subscription offer"
- tapOn: "Open settings"
- tapOn: "Plan & privacy"
- tapOn: "Pro & subscriptions"
- assertNotVisible: "DEVELOPMENT DEMO"
- scrollUntilVisible:
    element:
      text: "Reviewer access"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "Reviewer access"
- scrollUntilVisible:
    element:
      text: "Review code"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "Review code"
# Public negative-test input, never a usable reviewer credential.
- inputText: "invalid-native-review-probe"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Unlock Pro"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
    centerElement: false
- tapOn: "Unlock Pro"
- extendedWaitUntil:
    visible: "Invalid or unavailable review code."
    timeout: 20000
- takeScreenshot: reviewer-invalid-code
- assertNotVisible: "Reviewer access enabled.*"
