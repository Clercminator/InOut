appId: com.imrtech.inout
---
- launchApp:
    clearState: true
- tapOn: "Personalize InOut"
- tapOn: "Reduce stress & anxiety"
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "Comfort comes first."
- swipe:
    direction: LEFT
- assertVisible: "Comfort comes first."
- tapOn: "I understand"
- assertVisible: "A rhythm you can follow."
- takeScreenshot: onboarding-demo
- tapOn: "Start breathing"
- tapOn: "Close subscription offer"
- assertVisible: 'How are you feeling right now\?'
- openLink: "inout://"
- tapOn: { text: "Open", optional: true }
- assertVisible: "Quick reset"
- takeScreenshot: 01-today
- scrollUntilVisible:
    element:
      text: "Quick reset"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn: "Quick reset"
- assertVisible: 'How are you feeling right now\?'
- tapOn: "7 of 10"
- takeScreenshot: 02-pre
- scrollUntilVisible:
    element:
      text: "START PRACTICE.*"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn:
    text: "START PRACTICE.*"
    waitToSettleTimeoutMs: 500
- takeScreenshot: 03-session
- extendedWaitUntil:
    visible: 'How are you feeling right now\?'
    timeout: 70000
- scrollUntilVisible:
    element:
      text: "3 of 10"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn: "3 of 10"
- takeScreenshot: 04-post
- scrollUntilVisible:
    element:
      text: "SEE MY STATE SHIFT.*"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn: "SEE MY STATE SHIFT.*"
- scrollUntilVisible:
    element:
      text: "Tension down 4 points"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- takeScreenshot: 05-result
- scrollUntilVisible:
    element:
      text: ".*VIEW HISTORY.*"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- tapOn: ".*VIEW HISTORY.*"
- assertVisible: "HISTORY"
- takeScreenshot: 06-history
