appId: com.imrtech.inout
---
- launchApp:
    clearState: true
- tapOn: "Skip introduction"
- assertVisible: "Breathe for what's next."
- takeScreenshot: 01-today
- scrollUntilVisible:
    element:
      text: "Start practice"
    direction: DOWN
- tapOn: "Start practice"
- assertVisible: 'How tense are you right now\?'
- tapOn: "7 of 10"
- takeScreenshot: 02-pre
- scrollUntilVisible:
    element:
      text: "START PRACTICE.*"
    direction: DOWN
- tapOn:
    text: "START PRACTICE.*"
    waitToSettleTimeoutMs: 500
- takeScreenshot: 03-session
- extendedWaitUntil:
    visible: 'How tense are you now\?'
    timeout: 70000
- scrollUntilVisible:
    element:
      text: "3 of 10"
    direction: DOWN
- tapOn: "3 of 10"
- takeScreenshot: 04-post
- scrollUntilVisible:
    element:
      text: "SEE MY STATE SHIFT.*"
    direction: DOWN
- tapOn: "SEE MY STATE SHIFT.*"
- assertVisible: "Tension down 4 points"
- takeScreenshot: 05-result
- scrollUntilVisible:
    element:
      text: ".*VIEW HISTORY.*"
    direction: DOWN
- tapOn: ".*VIEW HISTORY.*"
- assertVisible: "HISTORY"
- takeScreenshot: 06-history
